[platformio]
default_envs = esp32c6-supermini

[env:esp32c6-supermini]
; PlatformIO official only ships Arduino 2.x (without ESP32-C6 support).
; pioarduino provides the supported Arduino 3.x toolchain for the C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; SuperMini boards use a DIO 4 MB flash chip.  The Espressif DevKitM preset is
; QIO and causes the ROM bootloader to reset continuously on this board.
board = esp32-c6-supermini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; The C6 SuperMini is connected through native USB.  Without this flag
  ; Arduino maps Serial to UART0 and its unsupported default pins crash
  ; during core startup before setup() can run.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; The C6 provides USB Serial/JTAG (not the USB-OTG peripheral).
  -D ARDUINO_USB_MODE=1

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=8
  -D STATUS_LED_INVERTED=1

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=0

[env:wemos-d1-mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1
