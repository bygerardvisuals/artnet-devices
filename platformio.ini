[platformio]
default_envs = esp32c6-supermini

[env:esp32c6-supermini]
; PlatformIO official only ships Arduino 2.x (without ESP32-C6 support).
; pioarduino provides the supported Arduino 3.x toolchain for the C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; The SuperMini C6 uses the 4 MB ESP32-C6 module layout of this DevKitM profile.
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=8
  -D STATUS_LED_INVERTED=1

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=0

[env:wemos-d1-mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1
