[platformio]
default_envs = esp32c6-supermini

[env]
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3

[env:esp32c6-supermini]
; PlatformIO official only ships Arduino 2.x (without ESP32-C6 support).
; pioarduino provides the supported Arduino 3.x toolchain for the C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; SuperMini boards use a DIO 4 MB flash chip.  The Espressif DevKitM preset is
; QIO and causes the ROM bootloader to reset continuously on this board.
board = esp32-c6-supermini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; The C6 SuperMini is connected through native USB.  Without this flag
  ; Arduino maps Serial to UART0 and its unsupported default pins crash
  ; during core startup before setup() can run.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; The C6 provides USB Serial/JTAG (not the USB-OTG peripheral).
  -D ARDUINO_USB_MODE=1
  ; C6 SuperMini: built-in single-colour LED (the RGB data pin is GPIO8).
  -D STATUS_LED_PIN=15
  -D STATUS_LED_INVERTED=0
  -D DEFAULT_OUTPUT_PIN=2

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
; SuperMini clones are sold with several flash chips. DIO at 40 MHz is the
; conservative mode: it also boots on QIO-capable chips while avoiding the
; silent post-flash boot failure seen with the board preset's QIO/80 MHz.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; C3 SuperMini uses its native USB Serial/JTAG interface.  Mapping Serial
  ; to it is required for Chrome configuration, logs and the post-flash link.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D STATUS_LED_PIN=8
  -D STATUS_LED_INVERTED=1
  -D DEFAULT_OUTPUT_PIN=3

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=0
  -D DEFAULT_OUTPUT_PIN=4

; Generic 4 MB reference images for the remaining Wi-Fi capable ESP32
; families. Output and status LED pins are exposed safely by the portal.
[env:esp32c2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
; Arduino-ESP32 currently exposes no compatible RMT backend for Adafruit
; NeoPixel on the C2. Keep this family fully usable for Art-Net GPIO/PWM
; instead of publishing a firmware image that cannot compile.
lib_ignore = Adafruit NeoPixel
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D PIXEL_OUTPUT_SUPPORTED=0
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=0
  -D DEFAULT_OUTPUT_PIN=3

[env:esp32s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=0
  -D DEFAULT_OUTPUT_PIN=4

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Build a 4 MB baseline image.  It also boots on larger-flash S3 boards.
board = esp32-s3-devkitc-1
board_build.partitions = default.csv
board_upload.flash_size = 4MB
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; The S3 SuperMini COM port is the native USB Serial/JTAG interface.
  ; Without these Arduino maps Serial to UART0, so Web Serial can flash the
  ; ROM bootloader but the USB configurator receives no ARCFG response.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D STATUS_LED_PIN=48
  -D STATUS_LED_INVERTED=0
  -D DEFAULT_OUTPUT_PIN=4

[env:wemos-d1-mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1
  -D DEFAULT_OUTPUT_PIN=5

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = scripts/merge_web_firmware.py
build_flags =
  -D STATUS_LED_PIN=2
  -D STATUS_LED_INVERTED=1
  -D DEFAULT_OUTPUT_PIN=5
