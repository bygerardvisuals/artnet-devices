name: Build firmware and publish installer

on:
  push:
    branches: [main]
    paths:
      - src/**
      - platformio.ini
      - scripts/**
      - web-installer/**
      - .github/workflows/build-firmware-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e esp32c6-supermini -e esp32c3-supermini -e esp32dev -e wemos-d1-mini -e nodemcuv2
      - name: Save generated firmware in the repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web-installer/firmware
          git diff --cached --quiet || git commit -m "Build firmware images"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer
      - id: deployment
        uses: actions/deploy-pages@v4
