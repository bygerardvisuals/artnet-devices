name: Build firmware and publish installer

on:
  push:
    branches: [main]
    paths:
      - src/**
      - platformio.ini
      - scripts/**
      - web-installer/**
      - .github/workflows/build-firmware-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: firmware-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e esp32c6-supermini -e esp32c3-supermini -e esp32c2 -e esp32dev -e esp32s2 -e esp32s3 -e wemos-d1-mini -e nodemcuv2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer
      - id: deployment
        uses: actions/deploy-pages@v4
