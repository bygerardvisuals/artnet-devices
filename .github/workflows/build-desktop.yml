name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop-app/**
      - web-installer/firmware/**
      - .github/workflows/build-desktop.yml

jobs:
  firmware:
    name: Firmware images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e esp32c6-supermini -e esp32c3-supermini -e esp32c2 -e esp32dev -e esp32s2 -e esp32s3 -e wemos-d1-mini
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: web-installer/firmware/artnet-devices-*.bin
          if-no-files-found: error
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
          - name: Windows
            os: windows-latest
            target: win
          - name: Linux
            os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-images
          path: web-installer/firmware
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci --prefix desktop-app
      - run: npm run dist:${{ matrix.target }} --prefix desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ArtNet-Devices-${{ matrix.name }}
          path: desktop-app/dist/*
          if-no-files-found: error
