name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop-app/**
      - web-installer/firmware/**
      - .github/workflows/build-desktop.yml

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
          - name: Windows
            os: windows-latest
            target: win
          - name: Linux
            os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci --prefix desktop-app
      - run: npm run dist:${{ matrix.target }} --prefix desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Art-Net-Relay-${{ matrix.name }}
          path: desktop-app/dist/*
          if-no-files-found: error
